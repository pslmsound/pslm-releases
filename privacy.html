<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>PSLM - Privacy Policy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The privacy policy moved to pslmsound.com on 2026-10-03. This page is kept ONLY as a
     redirect: the URL is baked into shipped PSLM builds (PslmShell.cpp) and was given to the
     App Store, so it must keep resolving for as long as those builds are in the wild.
     GitHub Pages cannot send a real 301, so this does it three ways: a canonical link for
     crawlers, a meta refresh, and a script redirect. Do NOT put policy text back here -- a
     second copy is how the two drift apart. Edit website/privacy.html in the main repo. -->
<link rel="canonical" href="https://pslmsound.com/privacy">
<meta http-equiv="refresh" content="0; url=https://pslmsound.com/privacy">
<style>
  body{background:#000;color:#f2f2f4;font-family:-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif;
       max-width:680px;margin:0 auto;padding:9vh 24px 12vh;line-height:1.65;text-align:center}
  h1{letter-spacing:.18em;font-weight:600}
  a{color:#5a92c8}
</style>
</head><body>
  <h1>PSLM</h1>
  <p>The PSLM privacy policy now lives at
     <a href="https://pslmsound.com/privacy">pslmsound.com/privacy</a>.</p>
  <p>Redirecting you there now.</p>
  <script>location.replace("https://pslmsound.com/privacy");</script>
</body></html>
